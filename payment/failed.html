<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Not Completed | Cybanext</title>
    <meta
        name="description"
        content="Your Cybanext payment was not completed."
    >

    <link rel="stylesheet" href="../style.css">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    >
</head>

<body>

<main class="dfir-payment-page">

    <div class="dfir-payment-card">

        <div class="dfir-payment-body">

            <div class="dfir-payment-header">

                <span class="dfir-eyebrow">
                    CYBANEXT INTERNSHIP PROGRAM
                </span>

                <div class="payment-result-icon payment-result-failed">
                    <i class="ti ti-alert-circle"></i>
                </div>

                <h1>Payment Not Completed</h1>

                <p>
                    Your payment was not completed or could not be verified.
                    No registration payment has been confirmed.
                </p>

            </div>


            <div class="payment-result-note">

                <i class="ti ti-help-circle"></i>

                <p>
                    If you cancelled the payment or experienced an error,
                    you can return to the payment page and try again.
                </p>

            </div>

            <p
                class="dfir-payment-message"
                id="retryMessage"
                aria-live="polite"
                style="display:none;"
            ></p>

            <div class="payment-result-actions">

                <button
                    type="button"
                    class="dfir-pay-button"
                    id="tryAgainBtn"
                >
                    Try Payment Again
                    <i class="ti ti-refresh"></i>
                </button>

                <a
                    href="../index.html"
                    class="error-home-btn"
                >
                    Return to Cybanext
                    <i class="ti ti-arrow-right"></i>
                </a>

            </div>

        </div>

    </div>

</main>


<script>
    const selectedTrack = sessionStorage.getItem('selectedTrack');
    const applicantEmail = sessionStorage.getItem('applicantEmail');
    const qualificationToken = sessionStorage.getItem('qualificationToken');
    const retryMessage = document.getElementById('retryMessage');
    const tryAgainBtn =
        document.getElementById('tryAgainBtn');

    tryAgainBtn.addEventListener('click', async () => {
        if (!selectedTrack || !applicantEmail || !qualificationToken) {
            retryMessage.textContent =
                'Your qualified application could not be found. Return to the application page and complete CV screening before paying.';
            retryMessage.className = 'dfir-payment-message error';
            retryMessage.style.display = 'block';
            return;
        }

        tryAgainBtn.disabled = true;
        tryAgainBtn.textContent = 'Preparing secure checkout...';
        retryMessage.textContent = '';
        retryMessage.style.display = 'none';

        const isDigitalForensics = selectedTrack === 'digital_forensics';
        const pricingOption =
            sessionStorage.getItem('selectedPricingOption') || 'GHS';
        const response = await fetch(
            isDigitalForensics
                ? '../api/initialize-digital-forensics-payment'
                : '../api/initialize-payment',
            {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email: applicantEmail,
                    track: selectedTrack,
                    qualificationToken,
                    ...(isDigitalForensics ? { pricingOption } : {})
                })
            }
        );
        const result = await response.json();

        if (!response.ok || !result.authorizationUrl) {
            throw new Error(
                result.error || 'We could not start the payment. Please try again.'
            );
        }

        window.location.href = result.authorizationUrl;
    } catch (error) {
        console.error('Payment retry initialization error:', error);
        retryMessage.textContent =
            error.message || 'We could not start the payment. Please try again.';
        retryMessage.className = 'dfir-payment-message error';
        retryMessage.style.display = 'block';
        tryAgainBtn.disabled = false;
        tryAgainBtn.innerHTML =
            'Try Payment Again <i class="ti ti-refresh"></i>';
    });
</script>

</body>
</html>
