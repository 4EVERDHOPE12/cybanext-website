<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Request a Payment Receipt | Cybanext</title>
  <link rel="icon" type="image/png" href="assets/images/CYBANEXT ICON.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="applicant-auth.css">
  <link rel="stylesheet" href="applicant-receipt.css">
  <script src="applicant-receipt.js" defer></script>
</head>
<body>
  <main class="auth-shell">
    <a class="auth-logo" href="/" aria-label="Cybanext home">
      <img src="assets/images/CYBANEXT NB (3).png" alt="Cybanext">
    </a>
    <section class="auth-card" aria-labelledby="receipt-title">
      <p class="auth-eyebrow">Digital Forensics</p>
      <h1 id="receipt-title">Request your payment receipt</h1>
      <p class="auth-intro">
        Enter the registration email address. If a verified payment receipt is available,
        we’ll send it to that address. This page does not reveal registration or payment details.
      </p>
      <form id="receiptResendForm">
        <label for="email">Registration email address</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        <button id="requestReceiptButton" type="submit">Request receipt email</button>
      </form>
      <p id="receiptMessage" class="auth-message" role="status" aria-live="polite"></p>
      <a class="auth-home-link" href="/applicant-login.html">Return to applicant sign in</a>
      <a class="auth-home-link" href="/">Return to Cybanext</a>
    </section>
  </main>
</body>
</html>
