<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Applicant Portal | Cybanext</title>
  <link rel="icon" type="image/png" href="assets/images/CYBANEXT ICON.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="applicant-auth.css">
  <script src="applicant-dashboard.js" defer></script>
</head>
<body>
  <main class="auth-shell">
    <a class="auth-logo" href="/" aria-label="Cybanext home">
      <img src="assets/images/CYBANEXT NB (3).png" alt="Cybanext">
    </a>
    <section class="auth-card" aria-labelledby="dashboard-title">
      <p class="auth-eyebrow">Applicant portal</p>
      <h1 id="dashboard-title">Your sign-in is confirmed</h1>
      <p id="dashboardMessage" class="auth-intro" role="status" aria-live="polite">Checking your session…</p>
      <a class="auth-home-link" href="/">Return to Cybanext</a>
    </section>
  </main>
</body>
</html>
